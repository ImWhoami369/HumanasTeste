<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Unifesp 3.0 - Sala de Reunião</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #202124; /* Cor exata do fundo do Google Meet */
      color: #ffffff;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* Tela de Lobby / Apelido */
    #lobby-container {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: #11121a;
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 999;
    }

    .lobby-box {
      background: rgba(255, 255, 255, 0.05);
      padding: 40px;
      border-radius: 16px;
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      text-align: center;
      width: 90%;
      max-width: 400px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.5);
    }

    .lobby-box h2 { margin-bottom: 20px; font-size: 1.5rem; color: #fff; }

    .lobby-box input {
      width: 100%;
      padding: 12px 16px;
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      background: rgba(0, 0, 0, 0.3);
      color: #fff;
      font-size: 1rem;
      margin-bottom: 20px;
      outline: none;
      text-align: center;
    }

    .lobby-box input:focus { border-color: #8ab4f8; }

    .lobby-box button {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 8px;
      background: #8ab4f8; /* Azul clássico do Meet */
      color: #202124;
      font-weight: bold;
      font-size: 1rem;
      cursor: pointer;
      transition: background 0.2s;
    }

    .lobby-box button:hover { background: #aecbfa; }

    /* Container da sala de reunião */
    #meeting-container {
      display: none;
      flex-direction: column;
      height: 100vh;
      width: 100%;
    }

    header {
      padding: 15px 30px;
      background: rgba(0, 0, 0, 0.1);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .room-title { font-size: 1rem; font-weight: 500; display: flex; align-items: center; gap: 10px; color: #e8eaed; }
    .room-title .live-indicator { width: 8px; height: 8px; background-color: #037a72; border-radius: 50%; }

    /* Área Central dos Vídeos (Mosaico dinâmico do Google Meet) */
    #video-container {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      overflow: hidden;
    }

    #video-grid {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      align-items: center;
      gap: 12px;
      width: 100%;
      height: 100%;
      max-width: 1400px;
    }

    /* Cada caixinha de vídeo se ajustará dinamicamente via JS */
    .video-wrapper {
      position: relative;
      background: #3c4043;
      border-radius: 8px;
      overflow: hidden;
      aspect-ratio: 16 / 9;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.3s ease-in-out;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
    }

    video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transform: scaleX(-1); /* Efeito espelho natural */
    }

    /* Nome do participante discreto no canto inferior esquerdo */
    .user-name {
      position: absolute;
      bottom: 12px;
      left: 12px;
      background: rgba(32, 33, 36, 0.6);
      padding: 4px 12px;
      border-radius: 4px;
      font-size: 0.85rem;
      font-weight: 500;
      letter-spacing: 0.3px;
      max-width: 85%;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* Barra de Controles Inferior Redonda e Suspensa igual ao Meet */
    .controls-panel {
      padding: 24px;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #202124;
    }

    .controls-wrapper {
      display: flex;
      gap: 12px;
    }

    .control-btn {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: #3c4043;
      border: none;
      color: #ffffff;
      font-size: 1.1rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s;
    }

    .control-btn:hover {
      background: #4f5357;
    }

    /* Botão de desligar redondo e vermelho */
    .control-btn.leave-btn {
      background: #ea4335;
      width: 60px; /* Um pouco mais largo no Meet */
      border-radius: 24px;
    }

    .control-btn.leave-btn:hover {
      background: #f05a4f;
    }

    /* Classe quando mutado (Fundo vermelho discreto) */
    .control-btn.muted {
      background: #ea4335;
    }
    .control-btn.muted:hover {
      background: #f05a4f;
    }
  </style>

  <script src="/socket.io/socket.io.js" defer></script>
  <script src="https://unpkg.com/peerjs@1.4.7/dist/peerjs.min.js" defer></script>
  <script src="script.js" defer></script>
</head>
<body>

  <div id="lobby-container">
    <div class="lobby-box">
      <h2>Unifesp 3.0</h2>
      <input type="text" id="nickname-input" placeholder="Digite seu apelido..." maxlength="20" autofocus>
      <button id="enter-btn">Entrar na Reunião</button>
    </div>
  </div>

  <div id="meeting-container">
    <header>
      <div class="room-title">
        <div class="live-indicator"></div>
        <span>Reunião Acadêmica - Unifesp 3.0</span>
      </div>
      <div style="font-size: 0.9rem; color: #9aa0a6;">
        <i class="fa-solid fa-user-group"></i> <span id="participant-count">1</span> pessoas na chamada
      </div>
    </header>

    <div id="video-container">
      <div id="video-grid"></div>
    </div>

    <div class="controls-panel">
      <div class="controls-wrapper">
        <button class="control-btn" id="mic-btn" title="Ativar/Desativar Microfone">
          <i class="fa-solid fa-microphone"></i>
        </button>
        <button class="control-btn" id="cam-btn" title="Ativar/Desativar Câmera">
          <i class="fa-solid fa-video"></i>
        </button>
        <button class="control-btn leave-btn" onclick="window.location.reload()" title="Sair da Chamada">
          <i class="fa-solid fa-phone-slash"></i>
        </button>
      </div>
    </div>
  </div>

</body>
</html>
