<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Unifesp 3.0 - Sala de Reunião</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #202124;
      color: #ffffff;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* LOBBY INICIAL */
    #lobby-container {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 999;
    }
    #bg-video {
      position: absolute;
      top: 50%; left: 50%;
      min-width: 100%; min-height: 100%;
      z-index: -100;
      transform: translate(-50%, -50%);
      object-fit: cover;
      filter: brightness(0.35);
    }
    .lobby-box {
      background: rgba(32, 33, 36, 0.8);
      padding: 35px; border-radius: 16px;
      backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      text-align: center; width: 85%; max-width: 380px;
    }
    .lobby-box h2 { margin-bottom: 20px; font-size: 1.5rem; }
    .lobby-box input {
      width: 100%; padding: 14px; border-radius: 8px; border: 1px solid rgba(255, 255, 255, 0.2);
      background: rgba(0, 0, 0, 0.4); color: #fff; font-size: 1rem; margin-bottom: 20px; text-align: center; outline: none;
    }
    .lobby-box button {
      width: 100%; padding: 14px; border: none; border-radius: 8px;
      background: #8ab4f8; color: #202124; font-weight: bold; font-size: 1rem; cursor: pointer;
    }

    /* INTERFACE DA REUNIÃO */
    #meeting-container {
      display: none;
      flex-direction: column;
      height: 100vh;
      width: 100%;
    }

    header {
      padding: 15px 25px;
      background: #202124;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #3c4043;
    }
    .room-title { font-size: 1rem; font-weight: 500; display: flex; align-items: center; gap: 10px; }
    .room-title .live-indicator { width: 8px; height: 8px; background-color: #00fa9a; border-radius: 50%; }

    .main-content-layout {
      flex: 1;
      display: flex;
      flex-direction: row;
      overflow: hidden;
      position: relative;
    }

    #video-container {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 15px;
      overflow-y: auto;
      background: #11121a;
    }

    #video-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 12px;
      width: 100%;
      max-width: 1100px;
      justify-content: center;
    }

    #video-grid:has(> :nth-child(1):last-child) {
      grid-template-columns: minmax(260px, 650px);
    }

    .video-wrapper {
      position: relative;
      background: #3c4043;
      border-radius: 8px;
      overflow: hidden;
      aspect-ratio: 16 / 9;
      width: 100%;
    }

    video.user-video { width: 100%; height: 100%; object-fit: cover; }
    
    .no-cam-placeholder {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: #3c4043; display: flex; align-items: center;
      justify-content: center; font-size: 2.5rem; font-weight: bold; color: #8ab4f8;
    }

    .user-name {
      position: absolute;
      bottom: 10px; left: 10px;
      background: rgba(32, 33, 36, 0.85);
      padding: 4px 10px; border-radius: 4px; font-size: 0.8rem; z-index: 10;
    }

    /* CHAT LATERAL E MOBILE ESTRUTURADO */
    #chat-container {
      width: 340px;
      background: #202124;
      border-left: 1px solid #3c4043;
      display: flex;
      flex-direction: column;
      z-index: 100;
    }

    .chat-header { 
      padding: 15px; 
      border-bottom: 1px solid #3c4043; 
      font-weight: 600; 
      display: flex; 
      justify-content: space-between; 
      align-items: center; 
    }

    .close-chat-btn {
      display: none; /* Oculto no PC */
      background: #3c4043;
      border: none;
      color: #fff;
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 0.85rem;
      cursor: pointer;
    }
    
    #chat-messages {
      flex: 1; padding: 15px; overflow-y: auto;
      display: flex; flex-direction: column; gap: 12px;
    }

    .message-box { background: #2d2e30; padding: 10px; border-radius: 8px; max-width: 90%; align-self: flex-start; }
    .message-box .author { font-size: 0.75rem; color: #8ab4f8; font-weight: bold; margin-bottom: 2px; }
    .message-box .text { font-size: 0.85rem; word-break: break-word; color: #e8eaed; }

    .chat-input-area { padding: 12px; border-top: 1px solid #3c4043; display: flex; gap: 8px; }
    #chat-input {
      flex: 1; padding: 10px; border-radius: 20px; border: 1px solid #3c4043;
      background: #2d2e30; color: #fff; outline: none; font-size: 0.85rem;
    }
    #send-btn {
      background: #8ab4f8; border: none; width: 36px; height: 36px;
      border-radius: 50%; color: #202124; cursor: pointer; display: flex; align-items: center; justify-content: center;
    }

    /* REGRA DINÂMICA PARA O CELULAR */
    @media (max-width: 768px) {
      #chat-container { 
        display: none; /* Começa fechado no celular */
        width: 100%; 
        position: absolute; 
        right: 0; top: 0; 
        height: 100%; 
      }
      #chat-container.open { 
        display: flex; /* Abre por cima ocupando a tela inteira */
      }
      .close-chat-btn { 
        display: block; /* Revela o botão de voltar no celular */
      }
    }

    /* CONTROLES INFERIORES */
    .controls-panel { padding: 20px; display: flex; justify-content: center; background: #202124; border-top: 1px solid #3c4043; }
    .controls-wrapper { display: flex; gap: 12px; }
    .control-btn {
      width: 48px; height: 48px; border-radius: 50%; background: #3c4043;
      border: none; color: #fff; font-size: 1.1rem; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
    }
    .control-btn:hover { background: #4f5357; }
    .control-btn.leave-btn { background: #ea4335; width: 55px; border-radius: 20px; }
    .control-btn.muted { background: #ea4335; }
    .control-btn.chat-toggle-btn { background: #34a853; }
  </style>

  <script src="/socket.io/socket.io.js" defer></script>
  <script src="https://unpkg.com/peerjs@1.4.7/dist/peerjs.min.js" defer></script>
  <script src="script.js" defer></script>
</head>
<body>

  <div id="lobby-container">
    <video autoplay loop muted playsinline id="bg-video">
      <source src="https://videos.pexels.com/video-files/3191572/3191572-uhd_2560_1440_25fps.mp4" type="video/mp4">
    </video>
    <div class="lobby-box">
      <h2>Unifesp 3.0</h2>
      <input type="text" id="nickname-input" placeholder="Seu nome..." maxlength="15" autofocus>
      <button id="enter-btn">Entrar na Sala</button>
    </div>
  </div>

  <div id="meeting-container">
    <header>
      <div class="room-title">
        <div class="live-indicator"></div>
        <span>Sala Acadêmica</span>
      </div>
      <div style="font-size: 0.9rem; color: #9aa0a6;">
        <i class="fa-solid fa-user-group"></i> <span id="participant-count">0</span> na reunião
      </div>
    </header>

    <div class="main-content-layout">
      <div id="video-container">
        <div id="video-grid"></div>
      </div>

      <div id="chat-container">
        <div class="chat-header">
          <span><i class="fa-solid fa-comments"></i> Chat</span>
          <button class="close-chat-btn" id="close-chat-btn"><i class="fa-solid fa-arrow-left"></i> Voltar</button>
        </div>
        <div id="chat-messages"></div>
        <div class="chat-input-area">
          <input type="text" id="chat-input" placeholder="Enviar mensagem..." autocomplete="off">
          <button id="send-btn"><i class="fa-solid fa-paper-plane"></i></button>
        </div>
      </div>
    </div>

    <div class="controls-panel">
      <div class="controls-wrapper">
        <button class="control-btn" id="mic-btn"><i class="fa-solid fa-microphone"></i></button>
        <button class="control-btn" id="cam-btn"><i class="fa-solid fa-video"></i></button>
        <button class="control-btn chat-toggle-btn" id="chat-box-btn"><i class="fa-solid fa-message"></i></button>
        <button class="control-btn leave-btn" onclick="window.location.reload()"><i class="fa-solid fa-phone-slash"></i></button>
      </div>
    </div>
  </div>

</body>
</html>
