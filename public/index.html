<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Unifesp 3.0 - Sala de Reunião</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #202124; /* Fundo escuro oficial Google Meet */
      color: #ffffff;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* LOBBY INICIAL */
    #lobby-container {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 999;
      overflow: hidden;
    }

    #bg-video {
      position: absolute;
      top: 50%; left: 50%;
      min-width: 100%; min-height: 100%;
      width: auto; height: auto;
      z-index: -100;
      transform: translate(-50%, -50%);
      object-fit: cover;
      filter: brightness(0.35);
    }

    .lobby-box {
      background: rgba(32, 33, 36, 0.8);
      padding: 35px;
      border-radius: 16px;
      backdrop-filter: blur(15px);
      -webkit-backdrop-filter: blur(15px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      text-align: center;
      width: 85%;
      max-width: 380px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.6);
    }

    .lobby-box h2 { margin-bottom: 20px; font-size: 1.5rem; font-weight: 600; }

    .lobby-box input {
      width: 100%;
      padding: 14px;
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      background: rgba(0, 0, 0, 0.4);
      color: #fff;
      font-size: 1rem;
      margin-bottom: 20px;
      outline: none;
      text-align: center;
    }

    .lobby-box button {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 8px;
      background: #8ab4f8; /* Azul Meet */
      color: #202124;
      font-weight: bold;
      font-size: 1rem;
      cursor: pointer;
      transition: background 0.2s;
    }

    .lobby-box button:hover { background: #aecbfa; }

    /* ÁREA DA REUNIÃO */
    #meeting-container {
      display: none;
      flex-direction: column;
      height: 100vh;
      width: 100%;
    }

    header {
      padding: 15px 25px;
      background: rgba(0, 0, 0, 0.15);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .room-title { font-size: 1rem; font-weight: 500; display: flex; align-items: center; gap: 10px; }
    .room-title .live-indicator { width: 8px; height: 8px; background-color: #00fa9a; border-radius: 50%; }

    /* MOSAICO DE JANELINHAS (ESTILO MEET) */
    #video-container {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 15px;
      overflow-y: auto; /* Permite rolar se entrarem dezenas de pessoas */
    }

    #video-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); /* Cria o efeito "caixinhas" automático */
      gap: 12px;
      width: 100%;
      max-width: 1280px;
      justify-content: center;
    }

    /* Caso seja apenas 1 participante na chamada, a caixinha expande mais */
    #video-grid:has(> :nth-child(1):last-child) {
      grid-template-columns: minmax(280px, 700px);
    }

    .video-wrapper {
      position: relative;
      background: #3c4043;
      border-radius: 8px;
      overflow: hidden;
      aspect-ratio: 16 / 9; /* Mantém formato de câmera padrão de cinema */
      width: 100%;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
      border: 1px solid rgba(255, 255, 255, 0.05);
    }

    video.user-video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .user-name {
      position: absolute;
      bottom: 10px; left: 10px;
      background: rgba(32, 33, 36, 0.75);
      padding: 4px 10px;
      border-radius: 4px;
      font-size: 0.8rem;
    }

    /* BARRA DE CONTROLES INFERIOR */
    .controls-panel {
      padding: 20px;
      display: flex;
      justify-content: center;
      background: #202124;
    }

    .controls-wrapper { display: flex; gap: 12px; }

    .control-btn {
      width: 48px; height: 48px;
      border-radius: 50%;
      background: #3c4043;
      border: none; color: #fff;
      font-size: 1.1rem; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: background 0.2s;
    }
    .control-btn:hover { background: #4f5357; }

    .control-btn.leave-btn { background: #ea4335; width: 55px; border-radius: 20px; }
    .control-btn.leave-btn:hover { background: #f05a4f; }
    .control-btn.muted { background: #ea4335; }
  </style>

  <script src="/socket.io/socket.io.js" defer></script>
  <script src="https://unpkg.com/peerjs@1.4.7/dist/peerjs.min.js" defer></script>
  <script src="script.js" defer></script>
</head>
<body>

  <div id="lobby-container">
    <video autoplay loop muted playsinline id="bg-video">
      <source src="https://videos.pexels.com/video-files/3191572/3191572-uhd_2560_1440_25fps.mp4" type="video/mp4">
    </video>
    <div class="lobby-box">
      <h2>Unifesp 3.0</h2>
      <input type="text" id="nickname-input" placeholder="Seu nome para entrar..." maxlength="15" autofocus>
      <button id="enter-btn">Entrar na Sala</button>
    </div>
  </div>

  <div id="meeting-container">
    <header>
      <div class="room-title">
        <div class="live-indicator"></div>
        <span>Sala de Bate-Papo Acadêmica</span>
      </div>
      <div style="font-size: 0.9rem; color: #9aa0a6;">
        <i class="fa-solid fa-user-group"></i> <span id="participant-count">1</span> na reunião
      </div>
    </header>

    <div id="video-container">
      <div id="video-grid"></div>
    </div>

    <div class="controls-panel">
      <div class="controls-wrapper">
        <button class="control-btn" id="mic-btn"><i class="fa-solid fa-microphone"></i></button>
        <button class="control-btn" id="cam-btn"><i class="fa-solid fa-video"></i></button>
        <button class="control-btn leave-btn" onclick="window.location.reload()"><i class="fa-solid fa-phone-slash"></i></button>
      </div>
    </div>
  </div>

</body>
</html>
