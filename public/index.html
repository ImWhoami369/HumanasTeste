<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Unifesp 3.0 - Sala de Reunião</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #1a1a1a; /* Fundo escuro estilo Zoom */
      color: #ffffff;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* TELA DE LOBBY / APELIDO */
    #lobby-container {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 999;
      overflow: hidden;
    }

    #bg-video {
      position: absolute;
      top: 50%; left: 50%;
      min-width: 100%; min-height: 100%;
      width: auto; height: auto;
      z-index: -100;
      transform: translate(-50%, -50%);
      object-fit: cover;
      filter: brightness(0.3);
    }

    .lobby-box {
      background: rgba(30, 30, 30, 0.75);
      padding: 30px;
      border-radius: 12px;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      text-align: center;
      width: 85%;
      max-width: 360px;
      box-shadow: 0 15px 30px rgba(0,0,0,0.5);
    }

    .lobby-box h2 { margin-bottom: 20px; font-size: 1.4rem; color: #fff; font-weight: 600; }

    .lobby-box input {
      width: 100%;
      padding: 12px;
      border-radius: 6px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      background: rgba(0, 0, 0, 0.5);
      color: #fff;
      font-size: 1rem;
      margin-bottom: 25px;
      outline: none;
      text-align: center;
    }

    .lobby-box button {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 6px;
      background: #2D8CFF; /* Azul clássico do Zoom */
      color: #fff;
      font-weight: bold;
      font-size: 1rem;
      cursor: pointer;
      transition: background 0.2s;
    }

    .lobby-box button:hover { background: #1a75e6; }

    /* CONTAINER DA REUNIÃO */
    #meeting-container {
      display: none;
      flex-direction: column;
      height: 100vh;
      width: 100%;
    }

    header {
      padding: 12px 20px;
      background: #1a1a1a;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #2d2d2d;
    }

    .room-title { font-size: 0.95rem; font-weight: 500; display: flex; align-items: center; gap: 8px; }
    .room-title .live-indicator { width: 8px; height: 8px; background-color: #00FF87; border-radius: 50%; }

    /* Área Central dos Vídeos (Grid Nativo estilo Zoom) */
    #video-container {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 10px;
      background: #000000; /* Fundo preto para destacar as câmeras */
      overflow: hidden;
    }

    #video-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(45%, 1fr));
      gap: 10px;
      width: 100%;
      height: 100%;
      max-width: 1200px;
      align-content: center;
      justify-content: center;
    }

    /* Ajuste responsivo automático para telas pequenas (Celular em pé) */
    @media (max-width: 600px) {
      #video-grid {
        grid-template-columns: repeat(auto-fit, minmax(90%, 1fr));
      }
    }

    .video-wrapper {
      position: relative;
      background: #242424;
      border-radius: 6px;
      overflow: hidden;
      aspect-ratio: 16 / 9;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1px solid #333;
    }

    video.user-video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transform: scaleX(-1);
    }

    .user-name {
      position: absolute;
      bottom: 8px; left: 8px;
      background: rgba(0, 0, 0, 0.6);
      padding: 3px 8px;
      border-radius: 4px;
      font-size: 0.75rem;
      font-weight: 500;
    }

    /* Barra de Controles Inferior do Zoom */
    .controls-panel {
      padding: 15px;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #1a1a1a;
      border-top: 1px solid #2d2d2d;
    }

    .controls-wrapper { display: flex; gap: 15px; }

    .control-btn {
      width: 44px; height: 44px;
      border-radius: 8px;
      background: #242424;
      border: none; color: #fff;
      font-size: 1rem; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: background 0.2s;
    }
    .control-btn:hover { background: #333333; }

    .control-btn.leave-btn { background: #ea4335; }
    .control-btn.leave-btn:hover { background: #f05a4f; }
    .control-btn.muted { background: #ea4335; }
  </style>

  <script src="/socket.io/socket.io.js" defer></script>
  <script src="https://unpkg.com/peerjs@1.4.7/dist/peerjs.min.js" defer></script>
  <script src="script.js" defer></script>
</head>
<body>

  <div id="lobby-container">
    <video autoplay loop muted playsinline id="bg-video">
      <source src="https://videos.pexels.com/video-files/3191572/3191572-uhd_2560_1440_25fps.mp4" type="video/mp4">
    </video>
    <div class="lobby-box">
      <h2>Unifesp 3.0</h2>
      <input type="text" id="nickname-input" placeholder="Seu nome..." maxlength="15" autofocus>
      <button id="enter-btn">Entrar Agora</button>
    </div>
  </div>

  <div id="meeting-container">
    <header>
      <div class="room-title">
        <div class="live-indicator"></div>
        <span>Sala de Bate-Papo</span>
      </div>
      <div style="font-size: 0.85rem; color: #aaa;">
        <i class="fa-solid fa-user-group"></i> <span id="participant-count">1</span> online
      </div>
    </header>

    <div id="video-container">
      <div id="video-grid"></div>
    </div>

    <div class="controls-panel">
      <div class="controls-wrapper">
        <button class="control-btn" id="mic-btn"><i class="fa-solid fa-microphone"></i></button>
        <button class="control-btn" id="cam-btn"><i class="fa-solid fa-video"></i></button>
        <button class="control-btn leave-btn" onclick="window.location.reload()"><i class="fa-solid fa-phone-slash"></i></button>
      </div>
    </div>
  </div>

</body>
</html>
